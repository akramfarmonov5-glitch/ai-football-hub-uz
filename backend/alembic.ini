# Alembic konfiguratsiyasi.
#
# Diqqat: `sqlalchemy.url` ataylab bo'sh — baza manzili `alembic/env.py` da
# `app.core.config.settings` dan olinadi. Shunday qilib maxfiy ma'lumot bu
# faylga tushmaydi va ilova bilan migratsiyalar bir xil bazaga ishlaydi.

[alembic]
script_location = alembic
prepend_sys_path = .

# Migratsiya fayli nomiga sana qo'shiladi: 2026_07_27_1530-abc123_izoh.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# `timezone` ataylab belgilanmagan: u qo'shimcha `python-dateutil` paketini
# talab qiladi, foydasi esa faqat fayl nomidagi vaqt.

sqlalchemy.url =


[post_write_hooks]
# Kerak bo'lsa formatlash vositasini shu yerda ulash mumkin


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
